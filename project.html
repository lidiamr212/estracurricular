<body>
<aside class="botonback">
    <button onclick="history.back()">◀  <p class="text-heading-3">Volver</p></button>
</aside>
    <main>
    <div class="projectPage">
    
                <div class="bloqueTitulo">
                    <h1 id="project-title" class="text-display"></h1>
                    <h2 id="project-subtitle" class="text-heading-1"></h2>

                </div >
       
        <section class="bloque">

            <div id="project-images" class="bloquePhotos"></div>
            
            <div class="projectPage-info">
                <div class="bloqueTags">
                    <span class="lineaTags"><p class="text-label"><mark>Tag</mark></p><p id="project-tag" class="text-body-sm"></p></span>
                    <span class="lineaTags"><p class="text-label"><mark>Servicios</mark></p><p id="project-service" class="text-body-sm"></p></span>
                    <span class="lineaTags"><p class="text-label"><mark>Año</mark></p><p id="project-year" class="text-body-sm"></p></span>
                </div>
                <div class="bloqueTexto">
                    <span class="textoPrincipal accordion-item active">
                        <h4 class="text-heading-3 accordion-header" id="project-heading" style="display: inline;"></h4>
                        <div class="accordion-content"> 
                            <p class="text-body" id="project-text"></p>
                        </div>
                    </span>

                    <div class="TextoAccordion accordion-item">
                        <button class="accordion-header">
                            <p class="text-label" id="project-ACC1heading"></p>
                            <span class="icon">+</span>
                        </button>
                        <div class="accordion-content"> 
                            <p class="text-body" id="project-ACC1text"></p>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <button class="accordion-header">
                            <p class="text-label" id="project-ACC2heading">The Challenge</p>
                            <span class="icon">+</span>
                        </button>
                        <div class="accordion-content"> 
                            <p class="text-body" id="project-ACC2text"></p>
                            
                        </div>
                    </div>
                </div>
            </div>
        </section>


        </div>
    </main>
